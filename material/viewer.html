<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">Documento</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#0f1115; color:#eef0f4; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .topbar{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    background:#1a1d24; border-bottom:1px solid #2a2e38;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
  }
  .topbar a{ color:#5b8cff; text-decoration:none; font-size:14px; font-weight:600; white-space:nowrap; flex-shrink:0; }
  .topbar .fname{ color:#9aa3b2; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status{ text-align:center; padding:40px 20px; color:#9aa3b2; font-size:13px; }
  #pages{ padding: 10px max(8px, env(safe-area-inset-left)) max(40px, env(safe-area-inset-bottom)); }
  .pg-wrap{ text-align:center; margin-bottom:12px; }
  .pg-loading{ color:#5a6070; font-size:12px; padding:60px 0; border:1px dashed #2a2e38; border-radius:8px; margin:0 4px; }
  canvas.pg{ display:block; margin:0 auto; max-width:100%; height:auto; box-shadow:0 2px 10px rgba(0,0,0,.5); border-radius:2px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../materiales.html">&larr; Volver</a>
  <div class="fname" id="fname">Cargando…</div>
</div>
<div id="status">Cargando documento…</div>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  var title = params.get('title') || (src ? src.split('/').pop() : 'Documento');
  document.getElementById('fname').textContent = title;
  document.getElementById('pageTitle').textContent = title;

  var statusEl = document.getElementById('status');
  var pagesEl = document.getElementById('pages');

  if(!src){
    statusEl.textContent = 'No se especificó ningún documento.';
    return;
  }

  if(typeof pdfjsLib === 'undefined'){
    statusEl.textContent = 'No se pudo cargar el visor de PDF (revisa tu conexión) y vuelve a intentar.';
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsLib.getDocument(src).promise.then(function(pdf){
    statusEl.style.display = 'none';
    var dpr = window.devicePixelRatio || 1;
    var scale = Math.min(2.2, dpr * 1.4);
    var pageDivs = [];

    for(var i = 1; i <= pdf.numPages; i++){
      var wrap = document.createElement('div');
      wrap.className = 'pg-wrap';
      wrap.dataset.page = i;
      var loading = document.createElement('div');
      loading.className = 'pg-loading';
      loading.textContent = 'Página ' + i + ' de ' + pdf.numPages;
      wrap.appendChild(loading);
      pagesEl.appendChild(wrap);
      pageDivs.push(wrap);
    }

    var rendered = {};
    function renderPage(num){
      if(rendered[num]) return;
      rendered[num] = true;
      pdf.getPage(num).then(function(page){
        var viewport = page.getViewport({scale: scale});
        var canvas = document.createElement('canvas');
        canvas.className = 'pg';
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var natViewport = page.getViewport({scale: 1});
        canvas.style.width = Math.round(natViewport.width) + 'px';
        var ctx = canvas.getContext('2d');
        page.render({canvasContext: ctx, viewport: viewport}).promise.then(function(){
          var wrap = pageDivs[num - 1];
          wrap.innerHTML = '';
          wrap.appendChild(canvas);
        });
      });
    }

    renderPage(1);
    if(pdf.numPages > 1) renderPage(2);

    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            renderPage(parseInt(entry.target.dataset.page, 10));
          }
        });
      }, {root: null, rootMargin: '1000px 0px', threshold: 0.01});
      pageDivs.forEach(function(d){ io.observe(d); });
    } else {
      for(var p = 1; p <= pdf.numPages; p++) renderPage(p);
    }
  }).catch(function(err){
    statusEl.textContent = 'Error al cargar el PDF: ' + (err && err.message ? err.message : err);
  });
})();
</script>
</body>
</html>
