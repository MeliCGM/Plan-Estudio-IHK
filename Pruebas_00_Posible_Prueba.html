  .opt {

  .opt.checked { border-color: var(--primary); background: #eff6ff; }
  .opt.correct { border-color: var(--success); background: #d1fae5; font-weight: 600; }
  .opt.incorrect-checked { border-color: var(--danger); background: #fee2e2; }
  .opt.missed { border-color: var(--warning); background: #fffbeb; }
  .opt-box { width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 4px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
  .opt.checked .opt-box { background: var(--primary); border-color: var(--primary); color: white; }

  .verify-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
  .feedback { display: none; margin-top: 0.7rem; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.82rem; }

</head>

let order = questions.map((_, i) => i);
let verifiedCount = 0;
let correctCount = 0;

function render(){
  const main = document.getElementById('quizMain');
  main.innerHTML = '';
  order.forEach((qi, displayIdx) => {
    const item = questions[qi];
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.qi = qi;
    card.innerHTML = `<div class="q-num">Pregunta ${displayIdx+1} de ${questions.length}</div>
      <div class="q-text">${item.q}</div>
      <div class="q-hint">Selecciona todas las que consideres correctas (puede haber varias)</div>
      <div class="opt-list"></div>
      <button class="verify-btn">Comprobar</button>
      <div class="feedback"></div>`;
    const optList = card.querySelector('.opt-list');
    item.opts.forEach((opt, oi) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.dataset.oi = oi;
      div.innerHTML = `<div class="opt-box"></div><div>${opt.t}</div>`;
      div.addEventListener('click', () => {
        if (card.classList.contains('verified')) return;
        div.classList.toggle('checked');
      });
      optList.appendChild(div);
    });
    card.querySelector('.verify-btn').addEventListener('click', () => verify(card, qi));
    main.appendChild(card);
  });
}

  const item = questions[qi];
  const opts = card.querySelectorAll('.opt');
  let allCorrect = true;
  opts.forEach((div, oi) => {
    const isChecked = div.classList.contains('checked');
    const isCorrect = item.opts[oi].c;
    if (isCorrect && isChecked) div.classList.add('correct');
    else if (!isCorrect && isChecked) { div.classList.add('incorrect-checked'); allCorrect = false; }
    else if (isCorrect && !isChecked) { div.classList.add('missed'); allCorrect = false; }
  });
  card.querySelector('.verify-btn').disabled = true;
  card.querySelector('.verify-btn').textContent = 'Verificado';
  const fb = card.querySelector('.feedback');
  fb.classList.add('show', allCorrect ? 'ok' : 'bad');
  fb.textContent = allCorrect ? '✅ ¡Correcto! Todas las opciones marcadas bien.' : '⚠️ Revisa: verde=correcta que marcaste, amarillo=correcta que te faltó, rojo=marcaste una incorrecta.';
  verifiedCount++;
  if (allCorrect) correctCount++;
  updateProgress();
}

function updateProgress(){
  document.getElementById('progressBar').style.width = Math.round((verifiedCount/questions.length)*100) + '%';
  document.getElementById('scoreLine').textContent = verifiedCount + ' / ' + questions.length + ' verificadas · ' + correctCount + ' completamente correctas';
}

function resetAll(){
  verifiedCount = 0; correctCount = 0;
  render();
  updateProgress();
}

function shuffleQuestions(){
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  resetAll();
}

render();
updateProgress();
</script>
</body>
</html>
